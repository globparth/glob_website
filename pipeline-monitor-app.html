<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline Studio | Globriddge</title>
<meta name="description" content="A browser ETL tool: extract data from files or web addresses, transform it step by step, check it, load it onward and monitor every run.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Funnel Display';src:url(fonts/funnel-display-latin-wght-normal.woff2) format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'Geist';src:url(fonts/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#F3F6F2;--card:#FFFFFF;--soft2:#E9EFE8;--ink:#0B1410;--muted:#56665D;--line:#DFE7E0;--acc:#0A8F5B;--acc-d:#066B43;--hi:#C9F65F;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B42318;--badbg:#FEE4E2;--dark:#06110D;
--display:'Funnel Display','Helvetica Neue',Arial,sans-serif;--body:'Geist','Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--dark);color:#EAF5EE;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font:600 19px/1.1 var(--display);display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--hi);display:grid;place-items:center;flex:none}
.brand small{display:block;font:500 11px/1 var(--mono);color:#9DB5A8;margin-top:5px}
nav{display:grid;gap:4px}
nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;color:#9DB5A8;font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="page"]{background:var(--hi);color:var(--ink)}
nav .cnt{font:500 11px/1 var(--mono);background:var(--bad);color:#fff;padding:4px 7px;border-radius:99px}
aside .who{margin-top:auto;display:grid;gap:8px;font-size:13px;color:#9DB5A8}
aside select,aside input[type=text]{background:#0E1F18;border:1px solid #1F3A2E;color:#fff;border-radius:8px;padding:8px 10px;width:100%}
aside input[type=text]::placeholder{color:#6F877B}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(26px,3vw,38px)}
.top p{color:var(--muted);max-width:70ch;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g31{grid-template-columns:1.4fr 1fr}
.kpi b{display:block;font:600 32px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.lab{font:500 11px/1 var(--mono);color:var(--muted);display:block;margin-bottom:10px;letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--acc)}
.btn.g{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn.g:hover{background:var(--soft2)}
.btn.h{background:var(--hi);color:var(--ink)}.btn.h:hover{background:#b9ea45}
.btn.d{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.s{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font:500 11px/1 var(--mono);padding:6px 9px;border-radius:99px;background:var(--soft2);color:var(--acc-d);white-space:nowrap}
.pill.ok{background:var(--hi);color:var(--ink)}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.b{background:var(--badbg);color:var(--bad)}.pill.n{background:var(--soft2);color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}
table.data td,table.data th{white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;font-size:13px;padding:7px 10px}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
input[type=text],input[type=number],input[type=url],select,textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
textarea{min-height:120px;font:13px/1.5 var(--mono);resize:vertical}
label.f{display:grid;gap:6px;font:500 11px/1 var(--mono);color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.tab{border-radius:14px;padding:13px 14px;background:var(--card);border:1.5px solid var(--line);text-align:left;cursor:pointer}
.tab b{display:block;font:600 16px/1.1 var(--display)}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.tab.done{background:var(--ink);color:#fff;border-color:var(--ink)}.tab.done span{color:var(--hi)}
.tab.bad{background:var(--badbg);border-color:var(--badbg)}.tab.warn{background:var(--warnbg);border-color:var(--warnbg)}
.issue{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.issue:last-child{border-bottom:0}
.issue .fix{font-size:13px;color:var(--muted);border-left:3px solid var(--hi);padding-left:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:#fff}
.chk input{accent-color:var(--acc)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted);background:var(--bg)}
.drop.over{border-color:var(--acc);background:#fff}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:26px;margin-bottom:8px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:360px}
pre.msg{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--bg);border-radius:12px;padding:14px;margin:10px 0}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--hi);display:grid;place-items:center;font:600 12px/1 var(--mono)}
.step small{display:block;color:var(--muted);font-size:12px}
.step.err .n{background:var(--bad);color:#fff}
.runbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:16px}
.runbar .sp{flex:1}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .who{margin:0;grid-auto-flow:column}nav{grid-auto-flow:column;overflow-x:auto}.g4{grid-template-columns:1fr 1fr}.g2,.g31,.form{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0B1410" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-7 4 4 5-8 4 11"/></svg></i><div>Pipeline Studio<small>ETL BY GLOBRIDDGE</small></div></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="who"><label for="u-name">Your name</label><input id="u-name" type="text" placeholder="Name for the audit log"><label for="u-role">Role (demo)</label><select id="u-role"><option>Admin</option><option>Operator</option><option>Viewer</option></select></div>
</aside>
<main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var KEY='gb_pipeline_studio_v2';
var $=function(s,r){return (r||document).querySelector(s)};
function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){if(x==='class')e.className=a[x];else if(x==='text')e.textContent=a[x];else if(x==='value')e.value=a[x];else if(x.slice(0,2)==='on')e.addEventListener(x.slice(2),a[x]);else if(a[x]!==false&&a[x]!=null)e.setAttribute(x,a[x]===true?'':a[x])}
  (k||[]).forEach(function(c){if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var fmt=function(ts){return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
var ws={pipelines:[],runs:[],audit:[],user:'',role:'Admin'},view={name:'health',id:null,tab:'extract'},mem={};
function load(){try{var s=localStorage.getItem(KEY);if(s)ws=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ws))}catch(e){toast('Could not save in this browser. Export a backup from Settings.')}}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3600)}
function log(act,detail,by){ws.audit.unshift({ts:Date.now(),by:by||ws.user||'Unnamed',role:by?'System':ws.role,act:act,detail:detail});if(ws.audit.length>2000)ws.audit.length=2000}
var can=function(what){return ws.role==='Admin'||(ws.role==='Operator'&&(what==='run'||what==='resolve'))};
var pOf=function(id){return ws.pipelines.filter(function(p){return p.id===id})[0]};
var runsOf=function(id){return ws.runs.filter(function(r){return r.pid===id})};
function statusOf(p){var r=runsOf(p.id)[0];if(!r)return {k:'n',t:'Not run yet'};if(r.status==='Failed'&&!r.resolved)return {k:'b',t:'Failed'};if(r.status==='Warning'&&!r.resolved)return {k:'w',t:'Warning'};
  if(p.every&&Date.now()-r.ts>p.every*36e5*1.25)return {k:'w',t:'Overdue'};return {k:'ok',t:r.resolved?'Resolved':'Healthy'}}
var openAlerts=function(){return ws.runs.filter(function(r){return r.status!=='Passed'&&!r.resolved&&pOf(r.pid)})};

/* ================= EXTRACT ================= */
function parseDelim(text,dl){var rows=[],row=[],cur='',q=false,i=0,c;text=text.replace(/^﻿/,'');
  for(;i<text.length;i++){c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===dl){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.length>1||row[0]!=='')rows.push(row);return rows}
function jsonToRows(obj){var arr=Array.isArray(obj)?obj:null;if(!arr&&obj&&typeof obj==='object'){for(var k in obj)if(Array.isArray(obj[k])){arr=obj[k];break}}
  if(!arr)throw new Error('The JSON has no list of records.');var h=[];arr.forEach(function(o){if(o&&typeof o==='object')Object.keys(o).forEach(function(k){if(h.indexOf(k)<0)h.push(k)})});
  if(!h.length)throw new Error('The JSON records have no fields.');return [h].concat(arr.map(function(o){return h.map(function(k){var v=o?o[k]:'';return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)})}))}
function parseText(text){var t=text.trim();if(!t)return [];if(t[0]==='['||t[0]==='{'){return jsonToRows(JSON.parse(t))}
  var first=t.split(/\r?\n/)[0];return parseDelim(t,(first.split('\t').length>first.split(',').length)?'\t':(first.split(';').length>first.split(',').length?';':','))}
function readFile(file,cb){var n=file.name.toLowerCase(),fr=new FileReader();
  if(/\.(xlsx|xls)$/.test(n)){if(!window.XLSX){toast('Excel reading is unavailable. Save the sheet as CSV and try again.');return}
    fr.onload=function(){try{var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''}).map(function(r){return r.map(String)}),file.name)}catch(e){toast('That Excel file could not be read.')}};fr.readAsArrayBuffer(file)}
  else{fr.onload=function(){try{cb(parseText(String(fr.result)),file.name)}catch(e){toast('That file could not be read: '+e.message)}};fr.readAsText(file)}}
function extract(p){var s=p.source;
  if(s.type==='url'){if(!s.url)return Promise.reject(new Error('No web address is set for this pipeline.'));
    return fetch(s.url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('The address answered with error '+r.status+'.');return r.text()},function(){throw new Error('The address could not be reached from the browser. It may be offline or may not allow browser access.')}).then(function(t){return {rows:parseText(t),name:s.url.split('/').pop()||s.url}})}
  if(s.type==='paste'){try{return Promise.resolve({rows:parseText(s.text||''),name:'pasted data'})}catch(e){return Promise.reject(new Error('The pasted data could not be read: '+e.message))}}
  if(s.type==='sample')return Promise.resolve({rows:sample(s.kind,false),name:'sample-good.csv'});
  if(mem[p.id]&&mem[p.id].src)return Promise.resolve({rows:mem[p.id].src,name:mem[p.id].name});
  return Promise.reject(new Error('NOFILE'))}

/* ================= TRANSFORM ================= */
var isNum=function(v){return v!==''&&v!=null&&!isNaN(Number(String(v).replace(/[,₹\s]/g,'')))};
var num=function(v){return Number(String(v).replace(/[,₹\s]/g,''))};
function isoDate(v){v=String(v).trim();var m;if(!v)return v;if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(v))){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)}
  var d=new Date(v);return isNaN(d)?v:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var COLS=function(t,s,keys){keys.forEach(function(k){var v=s[k];(Array.isArray(v)?v:[v]).forEach(function(c){if(c&&t.h.indexOf(c)<0)throw new Error('column “'+c+'” is not in the data at this step')})})};
var OPS={
 select:{label:'Keep columns',f:[['cols','Columns to keep','cols']],sum:function(s){return (s.cols||[]).join(', ')},run:function(t,s){COLS(t,s,['cols']);var ix=s.cols.map(function(c){return t.h.indexOf(c)});return {h:s.cols.slice(),d:t.d.map(function(r){return ix.map(function(i){return r[i]})})}}},
 rename:{label:'Rename a column',f:[['col','Column','col'],['to','New name','text']],sum:function(s){return s.col+' → '+s.to},run:function(t,s){COLS(t,s,['col']);if(!s.to)throw new Error('a new name is needed');var h=t.h.slice();h[h.indexOf(s.col)]=s.to;return {h:h,d:t.d}}},
 filter:{label:'Filter rows',f:[['col','Column','col'],['cmp','Keep rows where it','sel',['equals','does not equal','contains','does not contain','is greater than','is less than','is at least','is at most','is blank','is not blank']],['val','Value','text']],sum:function(s){return 'Keep rows where '+s.col+' '+s.cmp+(/blank/.test(s.cmp)?'':' '+s.val)},
   run:function(t,s){COLS(t,s,['col']);var i=t.h.indexOf(s.col),v=String(s.val==null?'':s.val),n=isNum(v);return {h:t.h,d:t.d.filter(function(r){var x=String(r[i]==null?'':r[i]).trim(),both=n&&isNum(x),a=both?num(x):x.toLowerCase(),b=both?num(v):v.toLowerCase();
     switch(s.cmp){case 'equals':return a===b;case 'does not equal':return a!==b;case 'contains':return x.toLowerCase().indexOf(v.toLowerCase())>=0;case 'does not contain':return x.toLowerCase().indexOf(v.toLowerCase())<0;case 'is greater than':return both&&a>b;case 'is less than':return both&&a<b;case 'is at least':return both&&a>=b;case 'is at most':return both&&a<=b;case 'is blank':return x==='';default:return x!==''}})}}},
 trim:{label:'Trim spaces in every column',f:[],sum:function(){return 'All text values'},run:function(t){return {h:t.h.map(function(x){return String(x).trim()}),d:t.d.map(function(r){return r.map(function(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()})})}}},
 textcase:{label:'Change text case',f:[['col','Column','col'],['mode','To','sel',['UPPER CASE','lower case','Title Case']]],sum:function(s){return s.col+' to '+s.mode},run:function(t,s){COLS(t,s,['col']);var i=t.h.indexOf(s.col);return {h:t.h,d:t.d.map(function(r){r=r.slice();var v=String(r[i]==null?'':r[i]);r[i]=s.mode==='UPPER CASE'?v.toUpperCase():s.mode==='lower case'?v.toLowerCase():v.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()});return r})}}},
 replace:{label:'Find and replace',f:[['col','Column','col'],['find','Find','text'],['rep','Replace with','text']],sum:function(s){return 'In '+s.col+': “'+s.find+'” → “'+(s.rep||'')+'”'},run:function(t,s){COLS(t,s,['col']);if(!s.find)throw new Error('text to find is needed');var i=t.h.indexOf(s.col);return {h:t.h,d:t.d.map(function(r){r=r.slice();r[i]=String(r[i]==null?'':r[i]).split(s.find).join(s.rep||'');return r})}}},
 tonumber:{label:'Convert to a plain number',f:[['col','Column','col']],sum:function(s){return s.col+' (removes commas and ₹)'},run:function(t,s){COLS(t,s,['col']);var i=t.h.indexOf(s.col);return {h:t.h,d:t.d.map(function(r){r=r.slice();if(isNum(r[i]))r[i]=String(num(r[i]));return r})}}},
 todate:{label:'Standardise a date',f:[['col','Column','col']],sum:function(s){return s.col+' to year-month-day'},run:function(t,s){COLS(t,s,['col']);var i=t.h.indexOf(s.col);return {h:t.h,d:t.d.map(function(r){r=r.slice();r[i]=isoDate(r[i]);return r})}}},
 compute:{label:'Add a calculated column',f:[['name','New column name','text'],['left','First column','col'],['opr','Operation','sel',['add','subtract','multiply by','divide by','join text with']],['rtype','Second value is','sel',['a fixed value','another column']],['right','Fixed value','text'],['rcol','Other column','col']],
   sum:function(s){return s.name+' = '+s.left+' '+s.opr+' '+(s.rtype==='another column'?s.rcol:s.right)},
   run:function(t,s){COLS(t,s,s.rtype==='another column'?['left','rcol']:['left']);if(!s.name)throw new Error('a name for the new column is needed');var a=t.h.indexOf(s.left),b=t.h.indexOf(s.rcol);
     return {h:t.h.concat([s.name]),d:t.d.map(function(r){var x=r[a],y=s.rtype==='another column'?r[b]:s.right,o='';if(s.opr==='join text with')o=String(x==null?'':x)+String(y==null?'':y);
       else if(isNum(x)&&isNum(y)){var p=num(x),q=num(y),v=s.opr==='add'?p+q:s.opr==='subtract'?p-q:s.opr==='multiply by'?p*q:(q===0?NaN:p/q);o=isNaN(v)?'':String(Math.round(v*100)/100)}return r.concat([o])})}}},
