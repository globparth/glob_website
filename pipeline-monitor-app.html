<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline Monitor | Globriddge</title>
<meta name="description" content="Check every data file before it reaches the next system. Upload a file, validate it against your rules, fix failures and keep a full audit trail.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Funnel Display';src:url(fonts/funnel-display-latin-wght-normal.woff2) format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'Geist';src:url(fonts/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#F3F6F2;--card:#FFFFFF;--soft2:#E9EFE8;--ink:#0B1410;--muted:#56665D;--line:#DFE7E0;--acc:#0A8F5B;--acc-d:#066B43;--hi:#C9F65F;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B42318;--badbg:#FEE4E2;--dark:#06110D;
--display:'Funnel Display','Helvetica Neue',Arial,sans-serif;--body:'Geist','Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside{background:var(--dark);color:#EAF5EE;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font:600 19px/1.1 var(--display);display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--hi);display:grid;place-items:center;flex:none}
.brand small{display:block;font:500 11px/1 var(--mono);color:#9DB5A8;margin-top:5px}
nav{display:grid;gap:4px}
nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;color:#9DB5A8;font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="page"]{background:var(--hi);color:var(--ink)}
nav .cnt{font:500 11px/1 var(--mono);background:var(--bad);color:#fff;padding:4px 7px;border-radius:99px}
aside .who{margin-top:auto;display:grid;gap:8px;font-size:13px;color:#9DB5A8}
aside select,aside input[type=text]{background:#0E1F18;border:1px solid #1F3A2E;color:#fff;border-radius:8px;padding:8px 10px;width:100%}aside input[type=text]::placeholder{color:#6F877B}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(26px,3vw,38px)}
.top p{color:var(--muted);max-width:70ch;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g31{grid-template-columns:1.5fr 1fr}
.kpi b{display:block;font:600 34px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.lab{font:500 11px/1 var(--mono);color:var(--muted);display:block;margin-bottom:10px;letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{background:var(--acc)}
.btn.g{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn.g:hover{background:var(--soft2)}
.btn.h{background:var(--hi);color:var(--ink)}.btn.h:hover{background:#b9ea45}
.btn.d{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font:500 11px/1 var(--mono);padding:6px 9px;border-radius:99px;background:var(--soft2);color:var(--acc-d);white-space:nowrap}
.pill.ok{background:var(--hi);color:var(--ink)}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.b{background:var(--badbg);color:var(--bad)}.pill.n{background:var(--soft2);color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
input[type=text],input[type=number],select,textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
label.f{display:grid;gap:6px;font:500 11px/1 var(--mono);color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stg{border-radius:14px;padding:14px;background:var(--card);border:1px solid var(--line)}
.stg b{display:block;font:600 16px/1.1 var(--display)}
.stg span{font-size:12px;color:var(--muted)}
.stg.done{background:var(--ink);color:#fff;border-color:var(--ink)}.stg.done span{color:var(--hi)}
.stg.bad{background:var(--badbg);border-color:var(--badbg)}.stg.warn{background:var(--warnbg);border-color:var(--warnbg)}
.issue{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.issue:last-child{border-bottom:0}
.issue .fix{font-size:13px;color:var(--muted);border-left:3px solid var(--hi);padding-left:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:#fff}
.chk input{accent-color:var(--acc)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);background:var(--bg)}
.drop.over{border-color:var(--acc);background:#fff}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:26px;margin-bottom:8px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:340px}
pre.msg{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--bg);border-radius:12px;padding:14px;margin:10px 0}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .who{margin:0;grid-auto-flow:column}nav{grid-auto-flow:column;overflow-x:auto}.g4{grid-template-columns:1fr 1fr}.g2,.g31,.form{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0B1410" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-7 4 4 5-8 4 11"/></svg></i><div>Pipeline Monitor<small>BY GLOBRIDDGE</small></div></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="who"><label for="u-name">Your name</label><input id="u-name" type="text" placeholder="Name for the audit log"><label for="u-role">Role (demo)</label><select id="u-role"><option>Admin</option><option>Operator</option><option>Viewer</option></select></div>
</aside>
<main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var KEY='gb_pipeline_monitor_v1';
var $=function(s,r){return (r||document).querySelector(s)};
function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){if(x==='class')e.className=a[x];else if(x==='text')e.textContent=a[x];else if(x.slice(0,2)==='on')e.addEventListener(x.slice(2),a[x]);else if(a[x]!==false&&a[x]!=null)e.setAttribute(x,a[x]===true?'':a[x])}
  (k||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var fmt=function(ts){return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
var ws={pipelines:[],runs:[],audit:[],user:'',role:'Admin'},view={name:'health',id:null},mem={};
function load(){try{var s=localStorage.getItem(KEY);if(s)ws=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ws))}catch(e){toast('Could not save in this browser. Export a backup from Settings.')}}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function log(act,detail){ws.audit.unshift({ts:Date.now(),by:ws.user||'Unnamed',role:ws.role,act:act,detail:detail});if(ws.audit.length>2000)ws.audit.length=2000}
var can=function(what){return ws.role==='Admin'||(ws.role==='Operator'&&(what==='run'||what==='resolve'))};
var pOf=function(id){return ws.pipelines.filter(function(p){return p.id===id})[0]};
var runsOf=function(id){return ws.runs.filter(function(r){return r.pid===id})};
function statusOf(p){var r=runsOf(p.id)[0];if(!r)return {k:'n',t:'Not run yet'};if(r.status==='Failed'&&!r.resolved)return {k:'b',t:'Failed'};if(r.status==='Warning'&&!r.resolved)return {k:'w',t:'Warning'};
  if(p.every&&Date.now()-r.ts>p.every*36e5*1.25)return {k:'w',t:'Overdue'};return {k:'ok',t:r.resolved?'Resolved':'Healthy'}}
var openAlerts=function(){return ws.runs.filter(function(r){return r.status!=='Passed'&&!r.resolved&&pOf(r.pid)})};

/* ---------- file reading ---------- */
function parseCSV(text){var rows=[],row=[],cur='',q=false,i=0,c;text=text.replace(/^﻿/,'');
  for(;i<text.length;i++){c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.length>1||row[0]!=='')rows.push(row);return rows}
function readFile(file,cb){var n=file.name.toLowerCase(),fr=new FileReader();
  if(/\.(xlsx|xls)$/.test(n)){if(!window.XLSX){toast('Excel reading is unavailable. Save the sheet as CSV and try again.');return}
    fr.onload=function(){try{var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''}).map(function(r){return r.map(String)}),file.name)}catch(e){toast('That Excel file could not be read.')}};fr.readAsArrayBuffer(file)}
  else{fr.onload=function(){cb(parseCSV(String(fr.result)),file.name)};fr.readAsText(file)}}
function toCSV(rows){return rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n')}
function download(name,text){var a=el('a',{href:URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),download:name});document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
var isNum=function(v){return v!==''&&!isNaN(Number(String(v).replace(/[,₹\s]/g,'')))};
var num=function(v){return Number(String(v).replace(/[,₹\s]/g,''))};

/* ---------- profile + checks ---------- */
function profile(rows){var h=rows[0].map(function(x){return String(x).trim()}),d=rows.slice(1),req=[],numc=[],key='';
  h.forEach(function(c,i){var vals=d.map(function(r){return (r[i]==null?'':String(r[i])).trim()}),blank=vals.filter(function(v){return v===''}).length,nn=vals.filter(isNum).length;
    if(d.length&&blank===0)req.push(c);if(d.length&&nn/Math.max(1,d.length-blank)>.95&&nn>0)numc.push(c);
    if(!key&&blank===0&&d.length>1){var s={};if(vals.every(function(v){if(s[v])return false;s[v]=1;return true}))key=c}});
  return {cols:h,required:req,numeric:numc,key:key,minRows:Math.max(1,Math.floor(d.length*.5)),maxDropPct:30,allowNegative:false}}
function check(p,rows){var issues=[],h=rows.length?rows[0].map(function(x){return String(x).trim()}):[],d=rows.slice(1),R=p.rules,bad={};
  var add=function(sev,code,msg,fix,count){issues.push({sev:sev,code:code,msg:msg,fix:fix,count:count||0})};
  if(!rows.length||!d.length){add('fail','EMPTY','The file has no data rows.','The source system may have exported before its own job finished. Run the export again, then retry here.');return {issues:issues,status:'Failed',rows:0,clean:[],rejected:[]}}
  var missing=R.cols.filter(function(c){return h.indexOf(c)<0}),extra=h.filter(function(c){return c&&R.cols.indexOf(c)<0});
  if(missing.length)add('fail','COLUMNS_MISSING','Expected column'+(missing.length>1?'s':'')+' not found: '+missing.join(', ')+'.',extra.length?'The source probably renamed a column (new column seen: '+extra.join(', ')+'). Ask the source owner to restore the name, or accept the new layout below if the change is intended.':'A column was removed at the source. Ask the source owner to restore it, or remove it from the expected columns.');
  else if(extra.length)add('warn','COLUMNS_NEW','New column'+(extra.length>1?'s':'')+' in the file: '+extra.join(', ')+'.','Nothing is broken, but the next system will ignore the new data until the layout is accepted.');
  if(d.length<R.minRows)add('fail','TOO_FEW_ROWS',d.length+' rows received; at least '+R.minRows+' expected.','A partial export is the usual cause. Check the source filter or date range, then retry.');
  var last=runsOf(p.id).filter(function(r){return r.status!=='Failed'})[0];
  if(last&&last.rows&&d.length<last.rows*(1-R.maxDropPct/100))add('warn','VOLUME_DROP','Row count fell from '+last.rows+' to '+d.length+' ('+Math.round((1-d.length/last.rows)*100)+'% lower than the last good run).','Confirm with the source owner that the drop is real before the data is used.');
  R.required.forEach(function(c){var i=h.indexOf(c);if(i<0)return;var n=0;d.forEach(function(r,ri){if(String(r[i]==null?'':r[i]).trim()===''){n++;bad[ri]='Blank '+c}});
    if(n)add(n/d.length>.02?'fail':'warn','BLANKS',n+' row'+(n>1?'s have':' has')+' no value in “'+c+'”.','Rows with blanks are held back in the rejected file. Fill the values at the source and retry.',n)});
  if(R.key&&h.indexOf(R.key)>=0){var ki=h.indexOf(R.key),seen={},n=0;d.forEach(function(r,ri){var v=String(r[ki]).trim();if(v==='')return;if(seen[v]){n++;bad[ri]=bad[ri]||'Duplicate '+R.key}else seen[v]=1});
    if(n)add('warn','DUPLICATES',n+' duplicate value'+(n>1?'s':'')+' in the key column “'+R.key+'”.','The same record was exported twice. Duplicates are held back; the first copy is kept.',n)}
  R.numeric.forEach(function(c){var i=h.indexOf(c);if(i<0)return;var nb=0,ng=0;d.forEach(function(r,ri){var v=String(r[i]==null?'':r[i]).trim();if(v==='')return;if(!isNum(v)){nb++;bad[ri]=bad[ri]||'Not a number in '+c}else if(!R.allowNegative&&num(v)<0){ng++;bad[ri]=bad[ri]||'Negative '+c}});
    if(nb)add('fail','NOT_NUMBER',nb+' value'+(nb>1?'s':'')+' in “'+c+'” '+(nb>1?'are':'is')+' not a number.','Text has been typed into a number column, or the export format changed. Correct the source and retry.',nb);
    if(ng)add('warn','NEGATIVE',ng+' negative value'+(ng>1?'s':'')+' in “'+c+'”.','Negative values are held back. If returns or credits are expected here, allow negatives in the rules.',ng)});
  var clean=[h],rej=[h.concat(['Reason'])];d.forEach(function(r,ri){if(bad[ri])rej.push(r.concat([bad[ri]]));else clean.push(r)});
  var st=issues.some(function(x){return x.sev==='fail'})?'Failed':issues.length?'Warning':'Passed';
  return {issues:issues,status:st,rows:d.length,clean:clean,rejected:rej,header:h}}
function runPipeline(p,rows,fileName,retryOf){if(!can('run')){toast('Your role cannot run pipelines.');return}
  if(!p.rules){p.rules=profile(rows);log('Rules created','“'+p.name+'”: '+p.rules.cols.length+' columns learned from '+fileName)}
  var res=check(p,rows),run={id:uid(),pid:p.id,ts:Date.now(),by:ws.user||'Unnamed',file:fileName,rows:res.rows,status:res.status,issues:res.issues,cleanRows:Math.max(0,res.clean.length-1),rejectedRows:Math.max(0,res.rejected.length-1),resolved:null,retryOf:retryOf||null};
  ws.runs.unshift(run);if(ws.runs.length>500)ws.runs.length=500;mem[run.id]={clean:res.clean,rejected:res.rejected,header:res.header};
  log(retryOf?'Retry':'Run','“'+p.name+'” with '+fileName+': '+res.status+', '+res.rows+' rows, '+res.issues.length+' issue'+(res.issues.length===1?'':'s'));
  if(retryOf&&res.status==='Passed'){var old=ws.runs.filter(function(r){return r.id===retryOf})[0];if(old&&!old.resolved){old.resolved={by:run.by,ts:Date.now(),note:'Fixed by a successful retry.'};log('Resolved','“'+p.name+'”: earlier failure closed by a successful retry')}}
  save();go('pipe',p.id);toast(res.status==='Passed'?'Run passed. The clean file is ready.':'Run '+res.status.toLowerCase()+'. See the issues and suggested fixes.')}

/* ---------- sample data ---------- */
function sample(kind,broken){var r=[],i,s=11,rnd=function(){s=(s*16807)%2147483647;return s/2147483647};
  if(kind==='sales'){r.push(['Invoice No','Date','Customer','GST No','Amount','Region']);for(i=1;i<=(broken?70:120);i++)r.push(['INV-'+(3000+i),'2026-11-'+String(1+i%16).padStart(2,'0'),['Shree Traders','Kaveri Foods','Deccan Agro','Mahal Retail'][i%4],'27AAAC'+(1000+i)+'Z1',String(Math.round(8000+rnd()*90000)),['West','North','South','Export'][i%4]]);if(broken)r[0][3]='GSTIN'}
  if(kind==='cust'){r.push(['Customer ID','Name','Email','City','Credit Limit']);for(i=1;i<=80;i++)r.push(['C'+(100+i),'Customer '+i,(broken&&i%9===0)?'':'buyer'+i+'@example.com',['Pune','Mumbai','Nashik','Nagpur'][i%4],String(50000+i*1000)]);if(broken){r.push(r[5].slice());r.push(r[12].slice());r.push(r[20].slice())}}
  if(kind==='stock'){r.push(['SKU','Item','Warehouse','Quantity','Unit Cost']);for(i=1;i<=60;i++)r.push(['SKU-'+(500+i),'Item '+i,['Kharadi','Chakan'][i%2],String((broken&&i%11===0)?-Math.round(rnd()*40):(broken&&i%17===0)?'n/a':Math.round(rnd()*900)),(40+rnd()*400).toFixed(2)])}
  return r}
function loadSample(){ws.pipelines=[{id:'s1',name:'Daily sales export',source:'Billing system',dest:'Accounts dashboard',owner:'Finance lead',channel:'WhatsApp',contact:'',every:24,sample:'sales'},{id:'s2',name:'Customer master sync',source:'Order sheet',dest:'CRM',owner:'Sales operations',channel:'Email',contact:'',every:168,sample:'cust'},{id:'s3',name:'Stock levels feed',source:'Warehouse system',dest:'Planning sheet',owner:'Warehouse manager',channel:'WhatsApp',contact:'',every:24,sample:'stock'}];
  ws.runs=[];mem={};log('Sample loaded','Three sample pipelines created');ws.pipelines.forEach(function(p){p.rules=profile(sample(p.sample,false))});save();go('health');toast('Sample workspace loaded. Open a pipeline and run a good or a broken file.')}

/* ---------- alerts ---------- */
function alertText(r){var p=pOf(r.pid);return 'Pipeline alert: '+p.name+'\nStatus: '+r.status+' at '+fmt(r.ts)+'\nRoute: '+p.source+' to '+p.dest+'\nFile: '+r.file+' ('+r.rows+' rows)\n\n'+r.issues.map(function(x,i){return (i+1)+'. '+x.msg+'\n   Likely fix: '+x.fix}).join('\n')+'\n\nOwner: '+p.owner}
function alertLinks(r){var p=pOf(r.pid),t=encodeURIComponent(alertText(r)),digits=(p.contact||'').replace(/\D/g,''),o=[];
  o.push(el('a',{class:'btn h',target:'_blank',rel:'noopener',href:'https://wa.me/'+(p.channel==='WhatsApp'?digits:'')+'?text='+t,text:'Send on WhatsApp'}));
  o.push(el('a',{class:'btn g',href:'mailto:'+(p.channel==='Email'?encodeURIComponent(p.contact||''):'')+'?subject='+encodeURIComponent('Pipeline alert: '+p.name+' '+r.status)+'&body='+t,text:'Send by email'}));return o}

/* ---------- views ---------- */
var V={};
function go(name,id){view={name:name,id:id||null};render()}
function header(title,sub,actions){return el('div',{class:'top'},[el('div',null,[el('h1',{text:title}),sub?el('p',{text:sub}):null]),el('div',{class:'row'},actions||[])])}
